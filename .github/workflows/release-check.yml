name: Release Check

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version bump
        run: |
          CURRENT_VERSION=$(jq -r '.version' package.json)
          MAIN_VERSION=$(git show origin/main:package.json | jq -r '.version')

          if [ "$CURRENT_VERSION" = "$MAIN_VERSION" ]; then
            echo "::error::Version in package.json ($CURRENT_VERSION) has not been bumped"
            exit 1
          fi

          echo "Version bumped from $MAIN_VERSION to $CURRENT_VERSION"

      - name: Check changelog updated
        run: |
          CURRENT_VERSION=$(jq -r '.version' package.json)

          if ! grep -q "\[$CURRENT_VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md does not contain an entry for version $CURRENT_VERSION"
            exit 1
          fi

          echo "Changelog entry found for $CURRENT_VERSION"
